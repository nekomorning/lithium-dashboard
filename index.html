<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>碳酸锂数据看板 · 页面一 日度价格</title>
<style>
:root{
  --bg:#f4f6fa; --card:#ffffff; --border:#e5e9f0; --text:#1f2733; --sub:#6b7686;
  --up:#d92626; --down:#0a9a5c; --flat:#8a93a3; --accent:#0f4c81;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{background:var(--bg); color:var(--text);
  font-family:"Microsoft YaHei","PingFang SC","Helvetica Neue",Arial,sans-serif; font-size:14px;}
.wrap{max-width:1560px; margin:0 auto; padding:18px 22px 60px;}

/* 头部 */
.header{display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:14px;}
.header h1{font-size:24px; color:var(--accent); letter-spacing:1px;}
.header .date{color:var(--sub); font-size:13px;}
.tabs{display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;}
.tab{padding:7px 20px; border-radius:8px 8px 0 0; border:1px solid var(--border); border-bottom:none;
  background:#e9edf3; color:var(--sub); cursor:default; font-size:14px;}
.tab.active{background:var(--accent); color:#fff; font-weight:600;}
.tab.disabled{opacity:.55;}

/* 总结 */
.summary{background:var(--card); border:1px solid var(--border); border-radius:10px;
  padding:16px 20px; margin-bottom:16px; line-height:1.9;}
.summary h2{font-size:16px; color:var(--accent); margin-bottom:6px;}
.summary .up{color:var(--up); font-weight:600;}
.summary .down{color:var(--down); font-weight:600;}

/* 年份筛选 */
.filterbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:16px;
  background:var(--card); border:1px solid var(--border); border-radius:10px; padding:10px 16px;}
.filterbar .lbl{color:var(--sub); font-size:13px;}
.ybtn{display:inline-flex; align-items:center; gap:6px; padding:5px 14px; border-radius:16px;
  border:1px solid var(--border); background:#fff; cursor:pointer; font-size:13px; user-select:none; transition:all .15s;}
.ybtn .dot{width:10px; height:10px; border-radius:50%;}
.ybtn.off{opacity:.35; filter:grayscale(.6);}

/* 数据表 */
.tablecard{background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px 16px; margin-bottom:22px; overflow-x:auto;}
.tablecard h2{font-size:16px; color:var(--accent); margin-bottom:10px;}
table{width:100%; border-collapse:collapse; font-size:13px; min-width:1180px;}
th,td{padding:6px 10px; text-align:right; border-bottom:1px solid #eef1f6; white-space:nowrap;}
th{background:#f0f4f9; color:#44506a; font-weight:600; position:sticky; top:0;}
td:first-child, th:first-child{text-align:left;}
tr.grp td{background:#f7f9fc; color:var(--accent); font-weight:700; text-align:left; font-size:13px;}
td.up{color:var(--up); font-weight:600;} td.down{color:var(--down); font-weight:600;} td.flat{color:var(--flat);}
tr.abn td{background:#fff7f0;}
.badge{display:inline-block; margin-left:6px; padding:1px 7px; border-radius:9px; font-size:11px;
  background:var(--up); color:#fff; vertical-align:1px;}
.badge.dn{background:var(--down);}

/* 板块 */
.section-title{font-size:18px; color:var(--accent); font-weight:700; margin:26px 0 4px;
  padding-left:10px; border-left:4px solid var(--accent);}
.row-label{font-size:14px; color:var(--sub); margin:14px 0 8px; font-weight:600;}
.grid{display:grid; gap:14px;}
.grid.c1{grid-template-columns:repeat(2,1fr);}
.grid.c2{grid-template-columns:repeat(2,1fr);}
.grid.c3{grid-template-columns:repeat(3,1fr);}
.grid.c4{grid-template-columns:repeat(4,1fr);}
@media (max-width:1200px){ .grid.c4{grid-template-columns:repeat(2,1fr);} .grid.c3{grid-template-columns:repeat(2,1fr);} }
@media (max-width:720px){ .grid.c1,.grid.c2,.grid.c3,.grid.c4{grid-template-columns:1fr;} .wrap{padding:12px 10px 40px;} }

/* 图表卡片 */
.card{background:var(--card); border:1px solid var(--border); border-radius:10px; padding:12px 14px 6px; min-width:0;}
.card .ttl{font-size:14px; font-weight:700; color:#2a3345;}
.card .meta{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin:4px 0 2px;}
.card .val{font-size:20px; font-weight:700;}
.card .unit{font-size:11px; color:var(--sub);}
.card .chg{font-size:13px; font-weight:600;}
.card .chg.up{color:var(--up);} .card .chg.down{color:var(--down);} .card .chg.flat{color:var(--flat);}
.card .dt{font-size:11px; color:var(--sub);}
.chart{width:100%; height:150px;}
/* 宽图（一行2/3个）更高一些，呈更舒展的长方形 */
.grid.c2 .chart{height:170px;}
.grid.c3 .chart{height:170px;}
@media (max-width:720px){ .chart{height:140px;} }
.footer{margin-top:30px; color:var(--sub); font-size:12px; text-align:center;}

/* 导出按钮 & 弹窗 */
.exp-fab{position:fixed; right:22px; bottom:22px; z-index:9000; padding:12px 22px; border:none;
  border-radius:30px; background:var(--accent); color:#fff; font-size:15px; font-weight:600; cursor:pointer;
  box-shadow:0 6px 18px rgba(15,76,129,.35);}
.exp-fab:hover{background:#0c3e6b;}
.modal{position:fixed; inset:0; background:rgba(15,23,35,.55); display:none; align-items:center;
  justify-content:center; z-index:9999; padding:24px;}
.modal-box{background:#fff; border-radius:12px; width:min(96vw,1080px); max-height:92vh;
  display:flex; flex-direction:column; overflow:hidden; box-shadow:0 10px 40px rgba(0,0,0,.25);}
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:14px 18px; border-bottom:1px solid var(--border);}
.modal-head h3{font-size:16px; color:var(--accent);}
.modal-close{border:none; background:#eef1f6; color:#44506a; width:30px; height:30px; border-radius:8px; font-size:18px; line-height:1; cursor:pointer;}
.modal-close:hover{background:#dfe5ee;}
.modal-body{overflow:auto; padding:14px; background:#f4f6fa; text-align:center;}
.modal-body img{max-width:100%; height:auto; border:1px solid var(--border); border-radius:8px; background:#fff;}
.modal-foot{display:flex; align-items:center; gap:10px; padding:12px 18px; border-top:1px solid var(--border);}
.modal-foot .status{font-size:13px; color:var(--sub); flex:1; text-align:left;}
.btn{padding:8px 18px; border-radius:8px; border:1px solid var(--border); background:#fff; color:#2a3345; font-size:14px; cursor:pointer;}
.btn.primary{background:var(--accent); color:#fff; border-color:var(--accent);}
.btn:disabled{opacity:.5; cursor:not-allowed;}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>碳酸锂数据看板</h1>
    <div class="date">数据截至：<b id="latestDate"></b>　|　数据源：云端在线表（自动同步）（价格结构）</div>
  </div>
  <div class="tabs">
    <div class="tab active">日度价格</div>
    <a class="tab" href="p2.html">产量开工利润</a>
    <a class="tab" href="p3.html">产业链库存</a>
    <a class="tab" href="p4.html">数据对比</a>
  </div>

  <div class="summary" id="summary"></div>

  <div class="filterbar" id="filterbar"><span class="lbl">年份筛选（点击显隐，作用于全部图表）：</span></div>

  <div class="tablecard">
    <h2>最新数据一览表 <span style="font-size:12px;color:var(--sub);font-weight:400">（日环比 = 最新值相对上一交易日；周环比 = 最新值相对7天前；|环比%| ≥ 2% 标记为大幅变化，锂盐价差类指标不参与标记；电芯为周度数据，日环比列留空）</span></h2>
    <table id="dataTable">
      <thead><tr>
        <th>指标</th><th>单位</th><th>最新日期</th><th>最新值</th><th>前值</th><th>日环比增减</th><th>日环比%</th><th>标记</th>
        <th>上周值</th><th>周环比增减</th><th>周环比%</th><th>标记</th>
      </tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <div id="sections"></div>

  <div class="footer">碳酸锂数据看板 · 页面一（日度价格季节图）· 涨=红 跌=绿 · 最新年黑线、前一年红线</div>
</div>

<button class="exp-fab" id="expBtn">导出高清长图</button>
<div class="modal" id="expModal">
  <div class="modal-box">
    <div class="modal-head">
      <h3>导出高清长图（页面一~三 · 仅图表 · 已隐藏 2023 年）</h3>
      <button class="modal-close" id="expClose" title="关闭">×</button>
    </div>
    <div class="modal-body">
      <img id="expImg" alt="导出预览">
    </div>
    <div class="modal-foot">
      <span class="status" id="expStatus">准备就绪。</span>
      <button class="btn" id="expDown">下载图片</button>
      <button class="btn primary" id="expCopy" disabled>复制图片</button>
    </div>
  </div>
</div>
<div id="expHost" style="position:fixed;left:-100000px;top:0;width:0;height:0;overflow:hidden;"></div>


<script>
(function(){
  fetch('data.json').then(function(r){return r.json();}).then(function(data){
    window.__DATA__=data; window.D=data; loadECharts();
  }).catch(function(){
    document.body.insertAdjacentHTML("afterbegin","<div style='padding:20px;color:#c00'>数据加载失败，请检查网络或刷新后重试。</div>");
  });
})();

function loadECharts(){
  var urls=[
    "https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js",
    "https://cdn.bootcdn.net/ajax/libs/echarts/5.5.0/echarts.min.js",
    "https://unpkg.com/echarts@5.5.0/dist/echarts.min.js"
  ];
  var i=0;
  function tryNext(){
    if(i>=urls.length){document.body.insertAdjacentHTML("afterbegin","<div style='padding:20px;color:#c00'>ECharts 加载失败，请检查网络后刷新。</div>");return;}
    var s=document.createElement("script");
    s.src=urls[i++];
    s.onload=init;
    s.onerror=tryNext;
    document.head.appendChild(s);
  }
  tryNext();
}


var charts=[];
var yearVisible={};
var PALETTE=["#1E6FFF","#F59A23","#8B5CF6","#0FB5AE","#D63FA6","#7A6A53"]; // 其他年份配色

function yearColor(y){
  var ys=D.years, n=ys.length, idx=ys.indexOf(y);
  if(idx===n-1) return "#000000";
  if(idx===n-2) return "#E60000";
  return PALETTE[idx % PALETTE.length];
}
function fmt(v,dec){
  if(v===null||v===undefined||isNaN(v)) return "—";
  return Number(v).toLocaleString("zh-CN",{minimumFractionDigits:dec,maximumFractionDigits:dec});
}
function chgCls(c){ if(c===null||c===undefined||c===0) return "flat"; return c>0?"up":"down"; }
function arrow(c){ if(c===null||c===undefined||c===0) return "→"; return c>0?"▲":"▼"; }

function init(){
  document.getElementById("latestDate").textContent=D.latestDataDate;
  D.years.forEach(function(y){ yearVisible[y]=(String(y)!=="2023"); });
  buildFilter(); buildSummary(); buildTable(); buildSections();
  var t; window.addEventListener("resize",function(){ clearTimeout(t); t=setTimeout(function(){ charts.forEach(function(c){c.resize();}); },150); });
}

function buildFilter(){
  var bar=document.getElementById("filterbar");
  D.years.forEach(function(y){
    var b=document.createElement("span");
    b.className="ybtn"+(yearVisible[y]?"":" off"); b.dataset.year=y;
    b.innerHTML='<span class="dot" style="background:'+yearColor(y)+'"></span>'+y+"年";
    b.onclick=function(){
      yearVisible[y]=!yearVisible[y];
      b.classList.toggle("off",!yearVisible[y]);
      charts.forEach(function(c){ c.dispatchAction({type:"legendToggleSelect",name:String(y)}); });
    };
    bar.appendChild(b);
  });
}

function buildSummary(){
  var byKey={}; D.table.forEach(function(r){ byKey[r.key]=r; });
  function chgSpan(r,withPct){
    if(!r||r.chg===null||r.chg===undefined) return "（—）";
    var cls=chgCls(r.chg), sign=r.chg>0?"+":"";
    var s="<span class='"+cls+"'>"+sign+fmt(r.chg,r.dec);
    if(withPct && r.pct!==null && r.pct!==undefined) s+="，"+(r.pct>0?"+":"")+r.pct.toFixed(2)+"%";
    s+="</span>";
    return "（"+s+"）";
  }
  function seg(key,name,withPct){
    var r=byKey[key]; if(!r) return "";
    return name+" <b>"+fmt(r.latest,r.dec)+"</b>"+chgSpan(r,withPct);
  }
  var d=D.latestDataDate.slice(5).split("-");
  var dateTxt=parseInt(d[0],10)+"月"+parseInt(d[1],10)+"日";

  // 现货涨跌幅：仅"现货价格"板块，且剔除三个价差指标
  var exclude={"锂盐价差：内外价差":1,"锂盐价差：电碳-工碳":1,"锂盐价差：碳酸锂-氢氧化锂":1};
  var spotKeys={};
  D.layout.forEach(function(sec){
    if(sec.section!=="现货价格") return;
    sec.rows.forEach(function(row){ row.charts.forEach(function(ch){ spotKeys[ch.key]=1; }); });
  });
  var spot=D.table.filter(function(r){
    return spotKeys[r.key] && !exclude[r.key] && r.pct!==null && r.pct!==undefined;
  });
  var ups=spot.filter(function(r){return r.chg>0;}).sort(function(a,b){return b.pct-a.pct;});
  var dns=spot.filter(function(r){return r.chg<0;}).sort(function(a,b){return a.pct-b.pct;});
  function li(r){ return r.title+"（"+(r.chg>0?"+":"")+fmt(r.chg,r.dec)+"，"+(r.pct>0?"+":"")+r.pct.toFixed(2)+"%）"; }
  function liSpan(r){ return "<span class='"+(r.chg>0?"up":"down")+"'>"+li(r)+"</span>"; }

  var html="<h2>核心变化速览</h2><div>";
  html+=dateTxt+"，碳酸锂"+seg("主力收盘价","主力收盘价",true)+"，"
      +seg("总成交量","总成交量",true)+"，"
      +seg("总持仓量","总持仓量",true)+"，"
      +seg("基差","基差",false)+"，"
      +seg("9-1月差","9-1月差",false)+"，"
      +seg("仓单","仓单",true)+"。";
  html+="<br>现货价格涨幅居前："+(ups.length?ups.slice(0,3).map(liSpan).join("、"):"无")+"；";
  html+="跌幅居前："+(dns.length?dns.slice(0,3).map(liSpan).join("、"):"无")+"。";
  html+="</div>";
  document.getElementById("summary").innerHTML=html;
}

function buildTable(){
  var tb=document.querySelector("#dataTable tbody");
  var groups={};
  D.layout.forEach(function(sec){
    sec.rows.forEach(function(row){
      row.charts.forEach(function(ch){ groups[ch.key]=sec.section; });
    });
  });
  var lastGrp=null;
  var noBadge={"锂盐价差：内外价差":1,"锂盐价差：电碳-工碳":1,"锂盐价差：碳酸锂-氢氧化锂":1};
  function elig(key){ return (groups[key]==="盘面结构"||groups[key]==="现货价格") && !noBadge[key]; }
  D.table.forEach(function(r){
    var g=groups[r.key]||"";
    if(g!==lastGrp){
      var trg=document.createElement("tr"); trg.className="grp";
      trg.innerHTML="<td colspan='12'>"+g+"</td>"; tb.appendChild(trg); lastGrp=g;
    }
    var isWeekly=!!r.weekly;
    // 大幅变化标记：仅盘面结构+现货价格，剔除3个锂盐价差；日/周分别计算
    var dAbn=!isWeekly && r.pct!==null && Math.abs(r.pct)>=2 && elig(r.key);
    var wAbn=r.weekPct!==null && Math.abs(r.weekPct)>=2 && elig(r.key);
    var dCls=chgCls(isWeekly?0:r.chg), wCls=chgCls(r.weekChg);
    var tr=document.createElement("tr");
    if(dAbn||wAbn) tr.className="abn";
    tr.innerHTML=
      "<td>"+r.title+"</td><td style='color:var(--sub)'>"+r.unit+"</td>"+
      "<td style='color:var(--sub)'>"+(r.latestDate||"—")+"</td>"+
      "<td><b>"+fmt(r.latest,r.dec)+"</b></td>"+
      "<td>"+(isWeekly?"—":fmt(r.prev,r.dec))+"</td>"+
      "<td class='"+dCls+"'>"+(isWeekly?"—":((r.chg>0?"+":"")+fmt(r.chg,r.dec)))+"</td>"+
      "<td class='"+dCls+"'>"+(isWeekly?"—":(r.pct===null?"—":(r.pct>0?"+":"")+r.pct.toFixed(2)+"%"))+"</td>"+
      "<td>"+(dAbn?"<span class='badge"+(r.chg<0?" dn":"")+"'>大幅"+(r.chg>0?"上涨":"下跌")+"</span>":"")+"</td>"+
      "<td>"+fmt(r.weekAgo,r.dec)+"</td>"+
      "<td class='"+wCls+"'>"+((r.weekChg>0?"+":"")+fmt(r.weekChg,r.dec))+"</td>"+
      "<td class='"+wCls+"'>"+(r.weekPct===null?"—":(r.weekPct>0?"+":"")+r.weekPct.toFixed(2)+"%")+"</td>"+
      "<td>"+(wAbn?"<span class='badge"+(r.weekChg<0?" dn":"")+"'>大幅"+(r.weekChg>0?"上涨":"下跌")+"</span>":"")+"</td>";
    tb.appendChild(tr);
  });
}

function monthTicks(){
  // x轴按月起始日显示"n月"
  var idx={};
  D.xlabels.forEach(function(l,i){ if(l.slice(3)==="01") idx[i]=parseInt(l.slice(0,2),10)+"月"; });
  return idx;
}

function buildSections(){
  var root=document.getElementById("sections");
  var ticks=monthTicks();
  D.layout.forEach(function(sec,si){
    var h=document.createElement("div");
    h.className="section-title"; h.textContent=sec.section;
    root.appendChild(h);
    sec.rows.forEach(function(row){
      var lbl=document.createElement("div");
      lbl.className="row-label"; lbl.textContent=row.label;
      root.appendChild(lbl);
      var n=row.charts.length;
      var grid=document.createElement("div");
      grid.className="grid c"+Math.min(n,4);
      root.appendChild(grid);
      row.charts.forEach(function(ch){ makeCard(ch,ticks,grid); });
    });
  });
}

function makeCard(ch,ticks,grid){
  var ind=D.indicators[ch.key], st=ind.stat;
  var card=document.createElement("div"); card.className="card";
  var isW=!!st.weekly;
  var dChg=isW?st.weekChg:st.chg, dPct=isW?st.weekPct:st.pct;
  var cls=chgCls(dChg);
  card.innerHTML=
    '<div class="ttl">'+ind.title+'</div>'+
    '<div class="meta">'+
      '<span class="val">'+fmt(st.latest,ind.dec)+'<span class="unit"> '+ind.unit+'</span></span>'+
      '<span class="chg '+cls+'">'+arrow(dChg)+' '+(dChg>0?"+":"")+fmt(dChg,ind.dec)+
        '（'+(dPct===null?"—":(dPct>0?"+":"")+dPct.toFixed(2)+"%")+(isW?" 周环比":"")+'）</span>'+
      '<span class="dt">'+(st.latestDate||"")+(isW?"（周）":"")+'</span>'+
    '</div>';
  var div=document.createElement("div"); div.className="chart"; card.appendChild(div);
  grid.appendChild(card); // 先挂载到DOM再初始化，避免容器尺寸为0导致图表空白
  var c=echarts.init(div);
  var series=[], legend=[];
  D.years.forEach(function(y){
    var pts=ind.series[String(y)];
    if(!pts||!pts.length) return;
    legend.push(String(y));
    series.push({
      name:String(y), type:"line", showSymbol:false, connectNulls:true,
      data:pts, lineWidth:1,
      lineStyle:{width: y===D.years[D.years.length-1]?2.2:1.4, color:yearColor(y)},
      itemStyle:{color:yearColor(y)},
      emphasis:{focus:"series"},
      z: y===D.years[D.years.length-1]?10:5
    });
  });
  c.setOption({
    animation:false,
    grid:{left:8,right:14,top:26,bottom:4,containLabel:true},
    legend:{show:true, top:0, right:0, itemWidth:14, itemHeight:2, icon:"rect",
      textStyle:{fontSize:11,color:"#6b7686"}, data:legend},
    tooltip:{trigger:"axis", confine:true,
      formatter:function(ps){
        if(!ps.length) return "";
        var lab=D.xlabels[ps[0].value[0]];
        var s=lab.replace("-","月")+"日";
        ps.sort(function(a,b){return Number(b.seriesName)-Number(a.seriesName);});
        ps.forEach(function(p){
          s+="<br>"+p.marker+p.seriesName+"年： <b>"+fmt(p.value[1],ind.dec)+"</b>";
        });
        return s;
      }},
    xAxis:{type:"value", min:0, max:365, interval:1,
      axisLabel:{fontSize:10,color:"#8a93a3",
        formatter:function(v){ return ticks[v]||""; }},
      axisTick:{show:false}, axisLine:{lineStyle:{color:"#dde3ec"}},
      splitLine:{show:false}},
    yAxis:{type:"value", scale:true,
      axisLabel:{fontSize:10,color:"#8a93a3",
        formatter:function(v){ return Math.abs(v)>=10000?(v/10000)+"万":(Math.abs(v)>=1000?(v/1000)+"k":v); }},
      splitLine:{lineStyle:{color:"#eef1f6"}}},
    series:series
  });
  // 同步当前年份显隐状态
  D.years.forEach(function(y){
    if(!yearVisible[y]) c.dispatchAction({type:"legendToggleSelect",name:String(y)});
  });
  charts.push(c);
}
</script>

<script>
/* ===== 导出高清长图：页面一~三，仅图表，隐藏 2023 ===== */
(function(){
  function fmt(v,dec){
    if(v===null||v===undefined||isNaN(v)) return "—";
    return Number(v).toLocaleString("zh-CN",{minimumFractionDigits:dec,maximumFractionDigits:dec});
  }
  function arrow(c){ if(c===null||c===undefined||c===0) return "→"; return c>0?"▲":"▼"; }
  function yearColorEx(D,y){
    var ys=D.years, n=ys.length, idx=ys.indexOf(y);
    if(idx===n-1) return "#000000";
    if(idx===n-2) return "#E60000";
    var P=["#1E6FFF","#F59A23","#8B5CF6","#0FB5AE","#D63FA6","#7A6A53"];
    return P[idx % P.length];
  }
  function monthTicksEx(D){
    var idx={};
    D.xlabels.forEach(function(l,i){ if(l.slice(3)==="01") idx[i]=parseInt(l.slice(0,2),10)+"月"; });
    return idx;
  }
  function metaEx(st,mode){
    var freq=st.freq || (mode==="week" ? "week" : (st.weekly ? "week" : "day"));
    if(freq==="month") return {chg:st.chg, pct:st.pct, label:"月环比"};
    if(freq==="week")  return {chg:st.weekChg, pct:st.weekPct, label:"周环比"};
    return {chg:st.chg, pct:st.pct, label:"日环比"};
  }
  function colsFor(sheet,n){
    if(sheet.mode==="day") return Math.min(n,4);
    return n>=5?5:n;
  }
  function tileOption(D,ch,mode){
    var ind=D.indicators[ch.key], st=ind.stat;
    var m=metaEx(st,mode);
    var series=[], legend=[];
    D.years.forEach(function(y){
      if(String(y)==="2023") return;
      var pts=ind.series[String(y)];
      if(!pts||!pts.length) return;
      legend.push(String(y));
      series.push({name:String(y), type:"line", showSymbol:false, connectNulls:true, data:pts,
        lineStyle:{width: y===D.years[D.years.length-1]?2.6:1.6, color:yearColorEx(D,y)},
        itemStyle:{color:yearColorEx(D,y)}, emphasis:{focus:"series"},
        z: y===D.years[D.years.length-1]?10:5 });
    });
    var ticks=monthTicksEx(D);
    var valTxt=fmt(st.latest,ind.dec)+" "+ind.unit;
    var chgTxt="";
    if(m.chg!==null && m.chg!==undefined){
      chgTxt=arrow(m.chg)+" "+(m.chg>0?"+":"")+fmt(m.chg,ind.dec)
        +"（"+(m.pct===null?"—":(m.pct>0?"+":"")+m.pct.toFixed(2)+"%")+(m.label?(" "+m.label):"")+"）";
    }
    return {
      animation:false, backgroundColor:"#ffffff",
      title:{ text:ind.title, subtext:valTxt+(chgTxt?"   "+chgTxt:""),
        left:10, top:8,
        textStyle:{fontSize:20, fontWeight:700, color:"#2a3345"},
        subtextStyle:{fontSize:15, color:(m.chg>0?"#d92626":(m.chg<0?"#0a9a5c":"#6b7686"))} },
      grid:{left:10, right:16, top:66, bottom:8, containLabel:true},
      legend:{show:true, top:12, right:12, itemWidth:18, itemHeight:3, icon:"rect",
        textStyle:{fontSize:14, color:"#6b7686"}, data:legend},
      xAxis:{type:"value", min:0, max:365, interval:1,
        axisLabel:{fontSize:13, color:"#8a93a3", formatter:function(v){ return ticks[v]||""; }},
        axisTick:{show:false}, axisLine:{lineStyle:{color:"#dde3ec"}}, splitLine:{show:false}},
      yAxis:{type:"value", scale:true,
        axisLabel:{fontSize:13, color:"#8a93a3",
          formatter:function(v){ return Math.abs(v)>=10000?(v/10000)+"万":(Math.abs(v)>=1000?(v/1000)+"k":v); }},
        splitLine:{lineStyle:{color:"#eef1f6"}}},
      series:series
    };
  }

  var TILE_W=420, TILE_H=300, SCALE=2, GAP=10, MARGIN=20, BANNER=50;

  async function exportLongImage(){
    var box=document.getElementById("expModal");
    var img=document.getElementById("expImg");
    var status=document.getElementById("expStatus");
    var btn=document.getElementById("expCopy");
    box.style.display="flex"; img.style.display="none"; btn.disabled=true;
    status.textContent="正在生成高清长图，请稍候…（图表较多，约需数秒）";
    try{
      var sheets=[
        {title:"日度价格", file:"./data.json", mode:"day"},
        {title:"产量开工利润", file:"./p2.json", mode:"week"},
        {title:"产业链库存", file:"./p3.json", mode:"week"}
      ];
      var Ds=await Promise.all(sheets.map(function(s){ return fetch(s.file).then(function(r){ return r.json(); }); }));
      var host=document.getElementById("expHost");
      var tiles=[];
      Ds.forEach(function(D,si){
        D.layout.forEach(function(sec){
          sec.rows.forEach(function(row){
            row.charts.forEach(function(ch){
              var div=document.createElement("div");
              div.style.width=TILE_W+"px"; div.style.height=TILE_H+"px";
              host.appendChild(div);
              var c=echarts.init(div, null, {width:TILE_W, height:TILE_H});
              c.setOption(tileOption(D,ch,sheets[si].mode));
              tiles.push(c.getDataURL({pixelRatio:SCALE, backgroundColor:"#ffffff"}));
              c.dispose(); div.remove();
            });
          });
        });
      });
      // 计算布局
      var maxCols=1;
      Ds.forEach(function(D,si){
        D.layout.forEach(function(sec){
          sec.rows.forEach(function(row){
            var cols=colsFor(sheets[si], row.charts.length);
            if(cols>maxCols) maxCols=cols;
          });
        });
      });
      var contentW=maxCols*TILE_W+(maxCols-1)*GAP;
      var textOps=[], positions=[], curY=MARGIN+BANNER+18, tileIdx=0;
      Ds.forEach(function(D,si){
        textOps.push({x:MARGIN, y:curY+16, text:sheets[si].title+"　数据截至："+D.latestDataDate, size:28, color:"#0f4c81", bold:true});
        curY+=52;
        D.layout.forEach(function(sec){
          textOps.push({x:MARGIN, y:curY+18, text:"▍"+sec.section, size:24, color:"#0f4c81", bold:true});
          curY+=44;
          sec.rows.forEach(function(row){
            if(row.label){
              textOps.push({x:MARGIN, y:curY+14, text:row.label, size:18, color:"#6b7686", bold:false});
              curY+=32;
            }
            var cols=colsFor(sheets[si], row.charts.length);
            var rowW=cols*TILE_W+(cols-1)*GAP;
            var x0=MARGIN, x=x0;
            for(var k=0;k<row.charts.length;k++){
              positions.push({url:tiles[tileIdx], x:x*SCALE, y:curY*SCALE, w:TILE_W*SCALE, h:TILE_H*SCALE});
              tileIdx++; x+=TILE_W+GAP;
            }
            curY+=TILE_H+GAP;
          });
        });
      });
      var W=(contentW+2*MARGIN)*SCALE, H=(curY+MARGIN)*SCALE;
      var canvas=document.createElement("canvas");
      canvas.width=W; canvas.height=H;
      var ctx=canvas.getContext("2d");
      ctx.fillStyle="#f4f6fa"; ctx.fillRect(0,0,W,H);
      ctx.fillStyle="#0f4c81"; ctx.fillRect(0,0,W,BANNER*SCALE);
      ctx.fillStyle="#ffffff"; ctx.textBaseline="middle";
      ctx.font="bold "+(32*SCALE)+"px 'Microsoft YaHei','PingFang SC',sans-serif";
      ctx.fillText("碳酸锂数据看板", MARGIN*SCALE, BANNER*SCALE/2);
      textOps.forEach(function(t){
        ctx.fillStyle=t.color; ctx.textBaseline="middle";
        ctx.font=(t.bold?"bold ":"")+(t.size*SCALE)+"px 'Microsoft YaHei','PingFang SC',sans-serif";
        ctx.fillText(t.text, t.x*SCALE, t.y*SCALE);
      });
      await Promise.all(positions.map(function(p){
        return new Promise(function(res){ var im=new Image(); im.onload=function(){ p._img=im; res(p); }; im.onerror=function(){ res(p); }; im.src=p.url; });
      })).then(function(loaded){
        loaded.forEach(function(p){
          if(p._img) ctx.drawImage(p._img, p.x, p.y, p.w, p.h);
          ctx.strokeStyle="#e5e9f0"; ctx.lineWidth=Math.max(1,SCALE);
          ctx.strokeRect(p.x, p.y, p.w, p.h);
        });
        var url=canvas.toDataURL("image/png");
        img.src=url; img.style.display="block";
        status.textContent="生成完成：长图共 "+positions.length+" 张图表。点击「复制图片」即可粘贴到微信 / 文档。";
        btn.disabled=false;
        window.__expCanvas=canvas;
      });
    }catch(e){
      status.textContent="生成失败："+(e&&e.message?e.message:e);
      console.error(e);
    }
  }

  function copyExpImage(){
    var canvas=window.__expCanvas; if(!canvas) return;
    var st=document.getElementById("expStatus");
    if(!navigator.clipboard || !window.ClipboardItem){
      st.textContent="当前浏览器不支持一键复制，请改用「下载图片」后手动插入。"; return;
    }
    canvas.toBlob(function(blob){
      if(!blob){ st.textContent="复制失败：图片生成异常。"; return; }
      navigator.clipboard.write([new ClipboardItem({'image/png':blob})]).then(function(){
        st.textContent="✅ 已复制到剪贴板，可直接 Ctrl+V 粘贴到微信 / Word / PPT 等。";
      }).catch(function(err){
        st.textContent="复制被浏览器拦截（"+(err&&err.message?err.message:err)+"），请改用「下载图片」。";
      });
    },"image/png");
  }
  function downloadExpImage(){
    var canvas=window.__expCanvas; if(!canvas) return;
    var a=document.createElement("a");
    a.download="碳酸锂数据看板.png";
    a.href=canvas.toDataURL("image/png");
    a.click();
  }

  document.getElementById("expBtn").addEventListener("click", exportLongImage);
  document.getElementById("expCopy").addEventListener("click", copyExpImage);
  document.getElementById("expDown").addEventListener("click", downloadExpImage);
  document.getElementById("expClose").addEventListener("click", function(){ document.getElementById("expModal").style.display="none"; });
})();
</script>
</body>
</html>
