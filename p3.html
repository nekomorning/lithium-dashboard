<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>碳酸锂数据看板 · 产业链库存</title>
<style>
:root{
  --bg:#f4f6fa; --card:#ffffff; --border:#e5e9f0; --text:#1f2733; --sub:#6b7686;
  --up:#d92626; --down:#0a9a5c; --flat:#8a93a3; --accent:#0f4c81;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{background:var(--bg); color:var(--text);
  font-family:"Microsoft YaHei","PingFang SC","Helvetica Neue",Arial,sans-serif; font-size:14px;}
.wrap{max-width:1560px; margin:0 auto; padding:18px 22px 60px;}

/* 头部 */
.header{display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:14px;}
.header h1{font-size:24px; color:var(--accent); letter-spacing:1px;}
.header .date{color:var(--sub); font-size:13px;}
.tabs{display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;}
.tab{padding:7px 20px; border-radius:8px 8px 0 0; border:1px solid var(--border); border-bottom:none;
  background:#e9edf3; color:var(--sub); cursor:default; font-size:14px; text-decoration:none; display:inline-block;}
.tab.active{background:var(--accent); color:#fff; font-weight:600;}
.tab.disabled{opacity:.55;}

/* 总结 */
.summary{background:var(--card); border:1px solid var(--border); border-radius:10px;
  padding:16px 20px; margin-bottom:16px; line-height:1.9;}
.summary h2{font-size:16px; color:var(--accent); margin-bottom:6px;}
.summary .up{color:var(--up); font-weight:600;}
.summary .down{color:var(--down); font-weight:600;}

/* 年份筛选 */
.filterbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:16px;
  background:var(--card); border:1px solid var(--border); border-radius:10px; padding:10px 16px;}
.filterbar .lbl{color:var(--sub); font-size:13px;}
.ybtn{display:inline-flex; align-items:center; gap:6px; padding:5px 14px; border-radius:16px;
  border:1px solid var(--border); background:#fff; cursor:pointer; font-size:13px; user-select:none; transition:all .15s;}
.ybtn .dot{width:10px; height:10px; border-radius:50%;}
.ybtn.off{opacity:.35; filter:grayscale(.6);}

/* 数据表 */
.tablecard{background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px 16px; margin-bottom:22px; overflow-x:auto; position:relative;}
.tablecard h2{font-size:16px; color:var(--accent); margin-bottom:10px;}
.tablecard.collapsed table{display:none;}
.tc-toggle{position:absolute; top:12px; right:16px; padding:4px 14px; border:1px solid var(--border);
  border-radius:14px; background:#fff; color:var(--sub); cursor:pointer; font-size:12px; user-select:none; transition:all .15s; z-index:2;}
.tc-toggle:hover{border-color:var(--accent); color:var(--accent);}
table{width:100%; border-collapse:collapse; font-size:13px; min-width:980px;}
th,td{padding:6px 10px; text-align:right; border-bottom:1px solid #eef1f6; white-space:nowrap;}
th{background:#f0f4f9; color:#44506a; font-weight:600; position:sticky; top:0;}
td:first-child, th:first-child{text-align:left;}
tr.grp td{background:#f7f9fc; color:var(--accent); font-weight:700; text-align:left; font-size:13px;}
td.up{color:var(--up); font-weight:600;} td.down{color:var(--down); font-weight:600;} td.flat{color:var(--flat);}
tr.abn td{background:#fff7f0;}
.badge{display:inline-block; margin-left:6px; padding:1px 7px; border-radius:9px; font-size:11px;
  background:var(--up); color:#fff; vertical-align:1px;}
.badge.dn{background:var(--down);}

/* 板块 */
.section-title{font-size:18px; color:var(--accent); font-weight:700; margin:26px 0 4px;
  padding-left:10px; border-left:4px solid var(--accent);}
.row-label{font-size:14px; color:var(--sub); margin:14px 0 8px; font-weight:600;}
.grid{display:grid; gap:14px; justify-content:start;}
.grid.c1{grid-template-columns:repeat(2,minmax(0,480px));}
.grid.c2{grid-template-columns:repeat(2,minmax(0,480px));}
.grid.c3{grid-template-columns:repeat(3,minmax(0,420px));}
.grid.c4{grid-template-columns:repeat(4,minmax(0,300px));}
.grid.c5{grid-template-columns:repeat(5,minmax(0,240px));}
@media (max-width:1200px){ .grid.c5{grid-template-columns:repeat(3,minmax(0,260px));} .grid.c4{grid-template-columns:repeat(2,minmax(0,480px));} .grid.c3{grid-template-columns:repeat(2,minmax(0,480px));} .grid.c2{grid-template-columns:repeat(2,minmax(0,480px));} }
@media (max-width:720px){ .grid.c1,.grid.c2,.grid.c3,.grid.c4,.grid.c5{grid-template-columns:1fr;} .wrap{padding:12px 10px 40px;} }

/* 图表卡片 */
.card{background:var(--card); border:1px solid var(--border); border-radius:10px; padding:12px 14px 6px; min-width:0; position:relative;}
.card .ttl{font-size:14px; font-weight:700; color:#2a3345;}
.card .meta{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin:4px 0 2px;}
.card .val{font-size:20px; font-weight:700;}
.card .unit{font-size:11px; color:var(--sub);}
.card .chg{font-size:13px; font-weight:600;}
.card .chg.up{color:var(--up);} .card .chg.down{color:var(--down);} .card .chg.flat{color:var(--flat);}
.card .dt{font-size:11px; color:var(--sub);}
.card .note{position:absolute; top:10px; right:12px; max-width:62%; text-align:right;
  font-size:11px; font-weight:600; color:#e03131; line-height:1.3; pointer-events:none;}
/* 图表采用宽屏长方形（16:9≈1.78），呈横向长方形、左对齐，高度适中 */
.chart{width:100%; aspect-ratio:16 / 9; height:auto; min-width:0;}
/* 一行5图的板块：缩小字号，保持紧凑 */
.grid.c5 .card{padding:9px 9px 4px;}
.grid.c5 .card .ttl{font-size:12.5px;}
.grid.c5 .card .meta{gap:6px; margin:2px 0 1px;}
.grid.c5 .card .val{font-size:16px;}
.grid.c5 .card .chg{font-size:11.5px;}
.footer{margin-top:30px; color:var(--sub); font-size:12px; text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>碳酸锂数据看板</h1>
    <div class="date">数据截至：<b id="latestDate"></b>　|　数据源：云端在线表（自动同步）（产业链库存）</div>
  </div>
  <div class="tabs">
    <a class="tab" href="core.html">核心逻辑</a>
    <a class="tab" href="p7.html">中国锂产业链平衡</a>
    <a class="tab" href="event.html">事件及政策跟踪</a>
    <a class="tab" href="p6.html">全球年度平衡</a>
    <a class="tab" href="p5.html">全球汽车</a>
    <div class="tab active">产业链库存</div>
    <a class="tab" href="p2.html">产量开工利润</a>
    <a class="tab" href="p1.html">日度价格</a>
    <a class="tab" href="weekly.html">周报</a>
  </div>

  <div class="summary" id="summary"></div>

  <div class="filterbar" id="filterbar"><span class="lbl">年份筛选（点击显隐，作用于全部图表）：</span></div>

  <div class="tablecard collapsed" id="overviewCard">
    <h2>最新数据一览表 <span style="font-size:12px;color:var(--sub);font-weight:400">（环比：周度指标 = 最新值相对上一周观测，月度指标 = 相对上月值；|环比%| ≥ 5% 标记为大幅变化）</span></h2>
    <button class="tc-toggle" id="tcToggle" type="button">展开 ▾</button>
    <table id="dataTable">
      <thead><tr>
        <th>指标</th><th>单位</th><th>最新日期</th><th>最新值</th><th>前值</th><th>环比增减</th><th>环比%</th><th>标记</th>
      </tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <div id="sections"></div>
  <script>
  (function(){
    var card=document.getElementById('overviewCard');
    var btn=document.getElementById('tcToggle');
    if(card&&btn){
      btn.addEventListener('click',function(){
        var collapsed=card.classList.toggle('collapsed');
        btn.textContent=collapsed?'展开 ▾':'折叠 ▴';
      });
    }
  })();
  </script>

  <div class="footer">碳酸锂数据看板 · 产业链库存（季节图）· 涨=红 跌=绿 · 最新年黑线、前一年红线</div>
</div>


<script>
(function(){
  Promise.all([fetch('p3.json?v=1788414850').then(function(r){return r.json();})]).then(function(rs){
    window.__DATA__=rs[0]; window.D=rs[0]; loadECharts();
  }).catch(function(){
    document.body.insertAdjacentHTML("afterbegin","<div style='padding:20px;color:#c00'>数据加载失败，请检查网络或刷新后重试。</div>");
  });
})();

function loadECharts(){
  var urls=[
    "https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js",
    "https://cdn.bootcdn.net/ajax/libs/echarts/5.5.0/echarts.min.js",
    "https://unpkg.com/echarts@5.5.0/dist/echarts.min.js"
  ];
  var i=0;
  function tryNext(){
    if(i>=urls.length){document.body.insertAdjacentHTML("afterbegin","<div style='padding:20px;color:#c00'>ECharts 加载失败，请检查网络后刷新。</div>");return;}
    var s=document.createElement("script");
    s.src=urls[i++];
    s.onload=init;
    s.onerror=tryNext;
    document.head.appendChild(s);
  }
  tryNext();
}


var charts=[];

// 指定图表下方追加的小字备注（仅图表区，不影响速览/一览表）
var NOTE_KEYS={
  "碳酸锂总库存":"26.3.5起调增库存样本",
  "碳酸锂：贸易商及电芯厂库存":"26.3.5起调增库存样本",
  "碳酸锂：周度库存":"26.3.5起调增库存样本",
  "碳酸锂：周度表需":"26.3.5起调增库存样本"
};
var yearVisible={};
var PALETTE=["#1E6FFF","#F59A23","#8B5CF6","#0FB5AE","#D63FA6","#7A6A53"];

function yearColor(y){
  var ys=D.years, n=ys.length, idx=ys.indexOf(y);
  if(idx===n-1) return "#000000";
  if(idx===n-2) return "#E60000";
  return PALETTE[idx % PALETTE.length];
}
function fmt(v,dec){
  if(v===null||v===undefined||isNaN(v)) return "—";
  return Number(v).toLocaleString("zh-CN",{minimumFractionDigits:dec,maximumFractionDigits:dec});
}
function chgCls(c){ if(c===null||c===undefined||c===0) return "flat"; return c>0?"up":"down"; }
function arrow(c){ if(c===null||c===undefined||c===0) return "→"; return c>0?"▲":"▼"; }

function init(){
  document.getElementById("latestDate").textContent=D.latestDataDate;
  D.years.forEach(function(y){ yearVisible[y]=(String(y)!=="2023"); });
  buildFilter(); buildSummary(); buildTable(); buildSections();
  var t; window.addEventListener("resize",function(){ clearTimeout(t); t=setTimeout(function(){ charts.forEach(function(c){c.resize();}); },150); });
}

function buildFilter(){
  var bar=document.getElementById("filterbar");
  D.years.forEach(function(y){
    var b=document.createElement("span");
    b.className="ybtn"+(yearVisible[y]?"":" off"); b.dataset.year=y;
    b.innerHTML='<span class="dot" style="background:'+yearColor(y)+'"></span>'+y+"年";
    b.onclick=function(){
      yearVisible[y]=!yearVisible[y];
      b.classList.toggle("off",!yearVisible[y]);
      charts.forEach(function(c){ c.dispatchAction({type:"legendToggleSelect",name:String(y)}); });
    };
    bar.appendChild(b);
  });
}

function buildSummary(){
  var byKey={}; D.table.forEach(function(r){ byKey[r.key]=r; });
  function spanW(r){
    if(!r||r.chg===null||r.chg===undefined) return "（—）";
    var cls=chgCls(r.chg), sign=r.chg>0?"+":"";
    var tail = (r.unit==="%") ? "" : "，"+(r.pct>0?"+":"")+r.pct.toFixed(2)+"%";
    return "<span class='"+cls+"'>（"+sign+fmt(r.chg,r.dec)+tail+"）</span>";
  }
  function seg(key){
    var r=byKey[key]; if(!r) return "";
    return "<b>"+fmt(r.latest,r.dec)+"</b>"+spanW(r);
  }
  var rows=D.table.filter(function(r){return r.pct!==null&&r.pct!==undefined;});
  var ups=rows.filter(function(r){return r.chg>0;}).sort(function(a,b){return b.pct-a.pct;});
  var dns=rows.filter(function(r){return r.chg<0;}).sort(function(a,b){return a.pct-b.pct;});
  function li(r){ return "<span class='"+(r.chg>0?"up":"down")+"'>"+r.title+"（"+(r.chg>0?"+":"")+fmt(r.chg,r.dec)+(r.unit==="%"?"":"，"+(r.pct>0?"+":"")+r.pct.toFixed(2)+"%")+"）</span>"; }
  var d=D.latestDataDate.slice(5).split("-");
  var dateTxt=parseInt(d[0],10)+"月"+parseInt(d[1],10)+"日";

  var html="<h2>核心变化速览</h2><div>";
  html+=dateTxt+"，碳酸锂总库存 "+seg("碳酸锂总库存")+" 吨、锂盐厂库存 "+seg("碳酸锂：锂盐厂库存")+" 吨、下游正极厂库存 "+seg("碳酸锂：下游正极厂库存")+" 吨、贸易商及电芯厂库存 "+seg("碳酸锂：贸易商及电芯厂库存")+" 吨、周度表需 "+seg("碳酸锂：周度表需")+" 吨。";
  html+="<br>环比涨幅居前："+(ups.length?ups.slice(0,3).map(li).join("、"):"无")+"；";
  html+="跌幅居前："+(dns.length?dns.slice(0,3).map(li).join("、"):"无")+"。";
  html+="</div>";
  document.getElementById("summary").innerHTML=html;
}

function buildTable(){
  var tb=document.querySelector("#dataTable tbody");
  var groups={};
  D.layout.forEach(function(sec){
    sec.rows.forEach(function(row){
      row.charts.forEach(function(ch){ groups[ch.key]=sec.section; });
    });
  });
  var lastGrp=null;
  D.table.forEach(function(r){
    var g=groups[r.key]||"";
    if(g!==lastGrp){
      var trg=document.createElement("tr"); trg.className="grp";
      trg.innerHTML="<td colspan='8'>"+g+"</td>"; tb.appendChild(trg); lastGrp=g;
    }
    var isPct=(r.unit==="%");
    var abn=r.pct!==null&&Math.abs(r.pct)>=5 && !isPct;
    var cls=chgCls(r.chg);
    var tr=document.createElement("tr");
    if(abn) tr.className="abn";
    tr.innerHTML=
      "<td>"+r.title+"</td><td style='color:var(--sub)'>"+r.unit+"</td>"+
      "<td style='color:var(--sub)'>"+(r.latestDate||"—")+"</td>"+
      "<td><b>"+fmt(r.latest,r.dec)+"</b></td>"+
      "<td>"+fmt(r.prev,r.dec)+"</td>"+
      "<td class='"+cls+"'>"+((r.chg>0?"+":"")+fmt(r.chg,r.dec))+"</td>"+
      "<td class='"+cls+"'>"+(isPct?"—":(r.pct===null?"—":(r.pct>0?"+":"")+r.pct.toFixed(2)+"%"))+"</td>"+
      "<td>"+(abn?"<span class='badge"+(r.chg<0?" dn":"")+"'>大幅"+(r.chg>0?"上涨":"下跌")+"</span>":"")+"</td>";
    tb.appendChild(tr);
  });
}

function monthTicks(){
  var idx={};
  D.xlabels.forEach(function(l,i){ if(l.slice(3)==="01") idx[i]=parseInt(l.slice(0,2),10)+"月"; });
  return idx;
}

function buildSections(){
  var root=document.getElementById("sections");
  var ticks=monthTicks();
  D.layout.forEach(function(sec){
    var h=document.createElement("div");
    h.className="section-title"; h.textContent=sec.section;
    root.appendChild(h);
    sec.rows.forEach(function(row){
      if(row.label){
        var lbl=document.createElement("div");
        lbl.className="row-label"; lbl.textContent=row.label;
        root.appendChild(lbl);
      }
      var n=row.charts.length;
      var grid=document.createElement("div");
      grid.className="grid "+(n>=5?"c5":"c"+n);
      root.appendChild(grid);
      row.charts.forEach(function(ch){ makeCard(ch,ticks,grid); });
    });
  });
}

function makeCard(ch,ticks,grid){
  var ind=D.indicators[ch.key], st=ind.stat;
  var noted=!!NOTE_KEYS[ch.key];
  var card=document.createElement("div"); card.className="card";
  // 按数据频率(freq)选择环比口径：month=月环比(chg/pct)，week=周环比(weekChg/weekPct)，day=日环比(chg/pct)
  var _f=st.freq||"week";
  var dChg, dPct, cyc;
  if(_f==="month"){ dChg=st.chg; dPct=st.pct; cyc="月环比"; }
  else if(_f==="day"){ dChg=st.chg; dPct=st.pct; cyc="日环比"; }
  else { dChg=st.weekChg; dPct=st.weekPct; cyc="周环比"; }
  var cls=chgCls(dChg);
  var pctTxt=(ind.unit==="%") ? "" : (dPct===null||dPct===undefined?"":(dPct>0?"+":"")+dPct.toFixed(2)+"% ");
  card.innerHTML=
    '<div class="ttl">'+ind.title+'</div>'+
    '<div class="meta">'+
      '<span class="val">'+fmt(st.latest,ind.dec)+'<span class="unit"> '+ind.unit+'</span></span>'+
      '<span class="chg '+cls+'">'+arrow(dChg)+' '+(dChg>0?"+":"")+fmt(dChg,ind.dec)+
        '（'+pctTxt+cyc+'）</span>'+
      '<span class="dt">'+(st.latestDate||"")+'</span>'+
    '</div>';
  var div=document.createElement("div"); div.className="chart"; card.appendChild(div);
  if(NOTE_KEYS[ch.key]){
    var note=document.createElement("div"); note.className="note";
    note.textContent="注："+NOTE_KEYS[ch.key];
    card.appendChild(note);
  }
  grid.appendChild(card); // 先挂载到DOM再初始化，避免容器尺寸为0导致图表空白
  var c=echarts.init(div);
  var series=[], legend=[];
  D.years.forEach(function(y){
    var pts=ind.series[String(y)];
    if(!pts||!pts.length) return;
    legend.push(String(y));
    series.push({
      name:String(y), type:"line", showSymbol:false, connectNulls:true,
      data:pts, lineWidth:1,
      lineStyle:{width: y===D.years[D.years.length-1]?2.2:1.4, color:yearColor(y)},
      itemStyle:{color:yearColor(y)},
      emphasis:{focus:"series"},
      z: y===D.years[D.years.length-1]?10:5
    });
  });
  var opt={
    animation:false,
    grid:{left:10,right:16,top:26,bottom:8,containLabel:true},
    legend:{show:true, top:0, right:0, itemWidth:14, itemHeight:2, icon:"rect",
      textStyle:{fontSize:11,color:"#6b7686"}, data:legend},
    tooltip:{trigger:"axis", confine:true,
      formatter:function(ps){
        if(!ps.length) return "";
        var lab=D.xlabels[ps[0].value[0]];
        var s=lab.replace("-","月")+"日";
        ps.sort(function(a,b){return Number(b.seriesName)-Number(a.seriesName);});
        ps.forEach(function(p){
          s+="<br>"+p.marker+p.seriesName+"年： <b>"+fmt(p.value[1],ind.dec)+"</b>";
        });
        return s;
      }},
    xAxis:{type:"value", min:0, max:365, interval:1,
      axisLabel:{fontSize:10,color:"#8a93a3",
        formatter:function(v){ return ticks[v]||""; }},
      axisTick:{show:false}, axisLine:{lineStyle:{color:"#dde3ec"}},
      splitLine:{show:false}},
    yAxis:{type:"value", scale:true,
      axisLabel:{fontSize:10,color:"#8a93a3",
        formatter:function(v){ return Math.abs(v)>=10000?(v/10000)+"万":(Math.abs(v)>=1000?(v/1000)+"k":v); }},
      splitLine:{lineStyle:{color:"#eef1f6"}}},
    series:series
  };
  if(noted){ opt.legend.left=8; opt.legend.right="auto"; }
  c.setOption(opt);
  // 同步当前年份显隐状态
  D.years.forEach(function(y){
    if(!yearVisible[y]) c.dispatchAction({type:"legendToggleSelect",name:String(y)});
  });
  charts.push(c);
}
</script>
<!-- 红色激光笔：点击右下角按钮开/关，鼠标变为红色激光点；光点 pointer-events:none，不影响原有悬停/浮层效果 -->
<div id="laserBtn" title="激光笔：点击开 / 关">🔴</div>
<div id="laserDot"></div>
<style>
#laserBtn{position:fixed; right:10px; bottom:10px; width:24px; height:24px; border-radius:50%;
  background:#fff; border:1.5px solid #e43a3a; color:#e43a3a; font-size:11px; line-height:1;
  display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:99999;
  box-shadow:0 1px 5px rgba(0,0,0,.15); user-select:none; transition:all .15s; opacity:.92;}
#laserBtn:hover{transform:scale(1.08);}
#laserBtn.on{background:#e43a3a; color:#fff; box-shadow:0 0 16px rgba(228,58,58,.65);}
#laserDot{position:fixed; left:0; top:0; width:10px; height:10px; border-radius:50%;
  background:#ff2d2d; box-shadow:0 0 6px 2px rgba(255,45,45,.55), 0 0 18px 6px rgba(255,45,45,.28);
  pointer-events:none; z-index:999999; display:none; transform:translate(-50%,-50%);}
#laserDot::after{content:''; position:absolute; right:6px; top:50%; width:34px; height:3px;
  transform:translateY(-50%); border-radius:2px;
  background:linear-gradient(90deg, rgba(255,45,45,.05), rgba(255,45,45,.6));}
</style>
<script>
(function(){
  var on=false;
  var btn=document.getElementById('laserBtn'), dot=document.getElementById('laserDot');
  function move(e){ dot.style.left=e.clientX+'px'; dot.style.top=e.clientY+'px'; }
  btn.addEventListener('click', function(ev){
    ev.stopPropagation();
    on=!on;
    btn.classList.toggle('on', on);
    if(on){
      dot.style.display='block';
      document.documentElement.style.cursor='none';
      window.addEventListener('mousemove', move);
      move(ev);
    } else {
      dot.style.display='none';
      document.documentElement.style.cursor='';
      window.removeEventListener('mousemove', move);
    }
  });
})();
</script>
</body>
</html>
