<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>碳酸锂数据看板 · 全球锂资源</title>
<style>
:root{
  --bg:#f4f6fa; --card:#ffffff; --border:#e5e9f0; --text:#1f2733; --sub:#6b7686;
  --up:#d92626; --down:#0a9a5c; --flat:#8a93a3; --accent:#0f4c81;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{background:var(--bg); color:var(--text);
  font-family:"Microsoft YaHei","PingFang SC","Helvetica Neue",Arial,sans-serif; font-size:14px;}
.wrap{max-width:1560px; margin:0 auto; padding:18px 22px 60px;}

.header{display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:14px;}
.header h1{font-size:24px; color:var(--accent); letter-spacing:1px;}
.header .date{color:var(--sub); font-size:13px;}
.tabs{display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap;}
.tab{padding:7px 20px; border-radius:8px 8px 0 0; border:1px solid var(--border); border-bottom:none;
  background:#e9edf3; color:var(--sub); cursor:default; font-size:14px; text-decoration:none; display:inline-block;}
.tab.active{background:var(--accent); color:#fff; font-weight:600;}
.tab.disabled{opacity:.55;}

.caliber{display:flex; align-items:center; gap:8px; margin-bottom:14px;
  background:#fff8e6; border:1px solid #f1d79a; border-radius:10px; padding:9px 16px;
  color:#8a6d1f; font-size:13px; font-weight:600;}
.caliber .ico{font-size:15px;}

.tablecard{background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px 16px; margin-bottom:22px; overflow-x:auto;}
.tablecard h2{font-size:16px; color:var(--accent); margin-bottom:10px;}
.tablecard h2 .note{font-size:12px; color:var(--sub); font-weight:400; margin-left:8px;}

/* 维度切换标签 */
.filterbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:14px;
  background:var(--card); border:1px solid var(--border); border-radius:10px; padding:10px 16px;}
.filterbar .lbl{color:var(--sub); font-size:13px;}
.ybtn{display:inline-flex; align-items:center; gap:6px; padding:5px 16px; border-radius:16px;
  border:1px solid var(--border); background:#fff; cursor:pointer; font-size:13px; user-select:none; transition:all .15s;}
.ybtn .dot{width:10px; height:10px; border-radius:50%;}
.ybtn.off{opacity:.4; filter:grayscale(.6); background:#f3f5f8;}
.ybtn.on{background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600;}

/* 表格 */
table{width:100%; border-collapse:collapse; font-size:13px; min-width:1400px;}
th,td{padding:6px 8px; text-align:right; border-bottom:1px solid #eef1f6; white-space:nowrap;}
th{background:#f0f4f9; color:#44506a; font-weight:600; position:sticky; top:0; z-index:2;}
td:first-child, th:first-child,
td:nth-child(2), th:nth-child(2),
td:nth-child(3), th:nth-child(3),
td:nth-child(4), th:nth-child(4){text-align:left;}
th.col-y{width:56px;} th.col-inc{width:84px;}
td.up{color:var(--up); font-weight:600;} td.down{color:var(--down); font-weight:600;} td.flat{color:var(--flat);}
tr.grp td{background:#eef3f9; color:var(--accent); font-weight:700; font-size:13px;}
tr.grp.global td{background:#e3edf7; color:#0b3a63; font-weight:800;}
td.proj{border-bottom:1px dashed #c5d2e2; cursor:help;}
td.proj:hover{color:var(--accent);}
tr.detail:hover td{background:#fafcff;}

/* 股权浮层 */
#tip{position:fixed; display:none; z-index:60; max-width:380px;
  background:#1f2733; color:#fff; border-radius:8px; padding:9px 12px; font-size:12.5px; line-height:1.5;
  box-shadow:0 6px 20px rgba(0,0,0,.22); pointer-events:none;}

.footer{margin-top:30px; color:var(--sub); font-size:12px; text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>全球锂资源</h1>
    <div class="date" id="updDate"></div>
  </div>
  <div class="tabs">
    <a class="tab" href="ypt.html">一页通</a>
    <a class="tab" href="p1.html">日度价格</a>
    <a class="tab" href="p2.html">产量开工利润</a>
    <a class="tab" href="p3.html">产业链库存</a>
    <a class="tab" href="p5.html">全球乘用车</a>
    <div class="tab active">全球锂资源</div>
    <a class="tab" href="p4.html">数据对比</a>
  </div>

  <div class="caliber">
    <span class="ico">📌</span>
    <span id="caliberTxt"></span>
  </div>

  <div class="tablecard">
    <h2>汇总表（全球锂资源供应）<span class="note">首行固定为全球锂资源供应合计；下方按所选维度汇总，可多选（如「按地区」+「按资源类型」即地区下再分资源类型）</span></h2>
    <div class="filterbar">
      <span class="lbl">汇总维度：</span>
      <span id="tagBar"></span>
    </div>
    <table class="t18" id="sumTable">
      <thead id="sumHead"></thead>
      <tbody id="sumBody"></tbody>
    </table>
  </div>

  <div class="tablecard">
    <h2>明细表（各锂矿项目）<span class="note">共 <span id="projCount"></span> 个项目；将鼠标悬停于「项目名称」可查看公司股权</span></h2>
    <table class="t18" id="detailTable">
      <thead id="detailHead"></thead>
      <tbody id="detailBody"></tbody>
    </table>
  </div>

  <div class="footer">碳酸锂数据看板 · 全球锂资源 · 产量单位：万吨 LCE（2026–2030 为预测值 E）· 涨=红 跌=绿</div>
</div>
<div id="tip"></div>


<script>
(function(){
  fetch('p6.json').then(function(r){return r.json();}).then(function(data){
    window.__DATA__=data; window.D=data; loadECharts();
  }).catch(function(){
    document.body.insertAdjacentHTML("afterbegin","<div style='padding:20px;color:#c00'>数据加载失败，请检查网络或刷新后重试。</div>");
  });
})();

function loadECharts(){
  var D = window.D;
  if(!D) return;
  var YEARS = D.years;
  var ROWS = D.rows;
  var I25 = YEARS.indexOf(2025), I26 = YEARS.indexOf(2026), I27 = YEARS.indexOf(2027);

  // ---------- 工具 ----------
  function fmt(v){ return (v==null) ? '—' : Number(v).toFixed(2); }
  function inc(v){ return (v==null) ? '—' : ((v>0?'+':'') + Number(v).toFixed(2)); }
  function incClass(v){ return (v==null) ? '' : (v>0 ? 'up' : (v<0 ? 'down' : 'flat')); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }
  function escAttr(s){ return esc(s).replace(/"/g,'&quot;'); }

  // 单行同比增量
  function rowInc(r){
    var v25=r.vals[I25], v26=r.vals[I26], v27=r.vals[I27];
    var i1 = (v25!=null && v26!=null) ? +(v26-v25).toFixed(2) : null;
    var i2 = (v26!=null && v27!=null) ? +(v27-v26).toFixed(2) : null;
    return [i1, i2];
  }
  // 一组行的年度产量求和
  function sumVals(rows){
    var s = YEARS.map(function(){return null;}), cnt = YEARS.map(function(){return 0;});
    rows.forEach(function(r){ r.vals.forEach(function(v,i){ if(v!=null){ s[i]=(s[i]==null?0:s[i])+v; cnt[i]++; } }); });
    return s.map(function(v,i){ return cnt[i] ? +v.toFixed(2) : null; });
  }
  function groupInc(vals){
    var v25=vals[I25], v26=vals[I26], v27=vals[I27];
    var i1=(v25!=null&&v26!=null)? +(v26-v25).toFixed(2):null;
    var i2=(v26!=null&&v27!=null)? +(v27-v26).toFixed(2):null;
    return [i1,i2];
  }

  // ---------- 表头 ----------
  var HEAD = ['地区','国家或地区','资源类型','项目名称']
    .concat(YEARS.map(function(y){ return String(y); }))
    .concat(['2026vs2025','2027vs2026']);
  function renderHead(thead){
    var cls = YEARS.map(function(){ return 'col-y'; }).concat(['col-inc','col-inc']);
    var html = '<tr>';
    HEAD.forEach(function(h,i){
      html += '<th'+(i>=4?(i>=YEARS.length+4?' class="col-inc"':' class="col-y"'):'')+'>'+esc(h)+'</th>';
    });
    html += '</tr>';
    thead.innerHTML = html;
  }

  // ---------- 行渲染 ----------
  function detailRow(r){
    var ic = rowInc(r);
    var t = '';
    t += '<td>'+esc(r.region)+'</td>';
    t += '<td>'+esc(r.country)+'</td>';
    t += '<td>'+esc(r.rtype)+'</td>';
    t += '<td class="proj" data-equity="'+escAttr(r.equity)+'">'+esc(r.project)+'</td>';
    YEARS.forEach(function(y,i){ t += '<td>'+fmt(r.vals[i])+'</td>'; });
    t += '<td class="'+incClass(ic[0])+'">'+inc(ic[0])+'</td>';
    t += '<td class="'+incClass(ic[1])+'">'+inc(ic[1])+'</td>';
    return '<tr class="detail">'+t+'</tr>';
  }
  function aggRow(labels, name, vals, opt){
    var ic = groupInc(vals);
    var pad = opt.indent>0 ? ' style="padding-left:'+(8+opt.indent*16)+'px"' : '';
    var t = '';
    t += '<td>'+esc(labels.region)+'</td>';
    t += '<td>'+esc(labels.country)+'</td>';
    t += '<td>'+esc(labels.rtype)+'</td>';
    t += '<td'+pad+'>'+(opt.global?'🌐 ':'')+esc(name)+'</td>';
    YEARS.forEach(function(y,i){ t += '<td>'+fmt(vals[i])+'</td>'; });
    t += '<td class="'+incClass(ic[0])+'">'+inc(ic[0])+'</td>';
    t += '<td class="'+incClass(ic[1])+'">'+inc(ic[1])+'</td>';
    return '<tr class="'+(opt.global?'grp global':'grp')+'">'+t+'</tr>';
  }

  // ---------- 汇总树 ----------
  var DIMS = ['region','country','rtype'];
  var LBL = {region:'按地区', country:'按国家', rtype:'按资源类型'};
  var selected = ['region'];

  function buildTree(rows, dims, depth, anc){
    anc = anc || {region:'—', country:'—', rtype:'—'};
    if(dims.length===0) return [];
    var key = dims[0];
    var groups = {};
    rows.forEach(function(r){ var k=(r[key]||'—'); (groups[k]=groups[k]||[]).push(r); });
    var keys = Object.keys(groups);
    // 按该组最新年（2030）产量降序
    var lastI = YEARS.length-1;
    keys.sort(function(a,b){ var va=sumVals(groups[a])[lastI], vb=sumVals(groups[b])[lastI];
      return (vb==null?-1e9:vb) - (va==null?-1e9:va); });
    var out = [];
    keys.forEach(function(g){
      var grp = groups[g];
      var vals = sumVals(grp);
      var newAnc = {}; newAnc.region=anc.region; newAnc.country=anc.country; newAnc.rtype=anc.rtype;
      newAnc[key] = g;
      out.push({anc:newAnc, name:g, vals:vals, depth:depth});
      if(dims.length>1) out = out.concat(buildTree(grp, dims.slice(1), depth+1, newAnc));
    });
    return out;
  }

  function renderSummary(){
    var globalVals = sumVals(ROWS);
    var html = aggRow({region:'—',country:'—',rtype:'—'}, '全球锂资源供应合计', globalVals, {global:true, indent:0});
    var tree = buildTree(ROWS, selected, 0);
    tree.forEach(function(node){ html += aggRow(node.anc, node.name, node.vals, {global:false, indent:node.depth}); });
    document.getElementById('sumBody').innerHTML = html;
  }

  function renderTags(){
    var bar = document.getElementById('tagBar');
    bar.innerHTML = DIMS.map(function(d){
      var on = selected.indexOf(d) >= 0;
      return '<span class="ybtn '+(on?'on':'off')+'" data-d="'+d+'">'+LBL[d]+'</span>';
    }).join('');
  }
  document.getElementById('tagBar').addEventListener('click', function(e){
    var b = e.target.closest('.ybtn'); if(!b) return;
    var d = b.getAttribute('data-d');
    var i = selected.indexOf(d);
    if(i>=0) selected.splice(i,1); else selected.push(d);
    if(selected.length===0) selected = ['region'];   // 未选任何维度时默认按地区
    renderTags(); renderSummary();
  });

  // ---------- 明细 ----------
  function renderDetail(){
    var html = '';
    ROWS.forEach(function(r){ html += detailRow(r); });
    document.getElementById('detailBody').innerHTML = html;
    document.getElementById('projCount').textContent = ROWS.length;
  }

  // ---------- 股权浮层 ----------
  var tip = document.getElementById('tip');
  var dt = document.getElementById('detailTable');
  function moveTip(e){
    var x = e.clientX + 14, y = e.clientY + 14;
    if(x + 390 > window.innerWidth) x = e.clientX - 390;
    if(y + 80 > window.innerHeight) y = e.clientY - 80;
    tip.style.left = x + 'px'; tip.style.top = y + 'px';
  }
  dt.addEventListener('mouseover', function(e){
    var c = e.target.closest('.proj');
    if(c){ tip.textContent = (c.getAttribute('data-equity')||'(无股权信息)'); tip.style.display='block'; moveTip(e); }
  });
  dt.addEventListener('mousemove', function(e){ if(tip.style.display==='block') moveTip(e); });
  dt.addEventListener('mouseout', function(e){ var c=e.target.closest('.proj'); if(c) tip.style.display='none'; });

  // ---------- 初始化 ----------
  document.getElementById('updDate').textContent = '底稿更新：' + (D.updated||'—');
  document.getElementById('caliberTxt').textContent = D.caliber || '';
  renderHead(document.getElementById('sumHead'));
  renderHead(document.getElementById('detailHead'));
  renderTags();
  renderSummary();
  renderDetail();
}
</script>
</body>
</html>
